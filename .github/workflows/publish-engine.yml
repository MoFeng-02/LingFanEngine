# =============================================================================
# 引擎 + SDK 自动发布工作流（NuGet 分发模式，2026-09 起）
# -----------------------------------------------------------------------------
# 触发：推送 tag `vX.Y.Z` 时自动：
#   1. publish-engine     : dotnet pack 三个引擎库 → push nuget.org（OIDC 受信任发布）
#                           + GitHub Packages 镜像
#   2. publish-template   : 注入引擎版本到模板 csproj → 打包 Template.zip + template-latest.json
#   3. publish-sdk-windows: 在 windows-latest 上 AOT 发布 SDK.Desktop (win-x64, WinExe 无控制台)
#   4. publish-sdk-linux  : 在 ubuntu-latest 上 AOT 发布 SDK.Desktop (linux-x64, 需 clang)
#   5. publish-sdk-macos  : 在 macos-latest 上 AOT 发布 SDK.Desktop (osx-arm64)
#   6. release            : 汇总所有产物，创建 GitHub Release 并上传 asset
#
# 版本全部由 tag 自动校准（-p:Version），不再写死。
#
# NuGet 发布前置条件（一次性配置）：
#   - nuget.org 用户名下为本仓库创建 Trusted Publishing 策略（owner=MoFeng-02，
#     repository=LingFanEngine，workflow=publish-engine.yml，environment=production）
#   - 仓库 Secrets 配置 NUGET_USER = nuget.org 用户名（profile name，非邮箱）
#   - GitHub Packages 镜像用内置 GITHUB_TOKEN，无需额外配置
#
# 说明：
#   - SDK.Desktop 的 OutputType 按构建机 OS 条件化：Windows=WinExe（无控制台），
#     其他平台=Avalonia 不支持 WinExe 故退为 Exe（会带控制台窗口，功能正常）。
#   - SDK/模板经 NuGet 引擎依赖（ProjectReference / PackageReference），无需预构建引擎
#     种子 DLL（原 SyncEngineDlls 机制已退役）。
# =============================================================================
name: Publish Engine + SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only (skip publish to NuGet.org)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-engine:
    name: Pack & Publish NuGet packages
    runs-on: windows-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved PACKAGE_VERSION=$version"

          # 提取纯数字版本（去掉 -alpha/-beta/-rc 等预发布后缀）
          # 专门用于 AssemblyVersion / FileVersion，解决 CS7034/CS7035 编译错误
          $cleanVersion = $version -replace '-.*$', ''
          $parts = $cleanVersion.Split('.')
          while ($parts.Count -lt 4) {
            $cleanVersion += '.0'
            $parts = $cleanVersion.Split('.')
          }
          "ASSEMBLY_VERSION=$cleanVersion" >> $env:GITHUB_ENV
          Write-Host "Resolved ASSEMBLY_VERSION=$cleanVersion"

      # 三个引擎库统一 pack：全套版本属性（nupkg 版本与程序集版本随 tag 一致；
      # -p:Version 等 MSBuild 全局属性会沿 ProjectReference 传递，依赖链同步校准）
      - name: Pack all engine libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/EngineCore/LingFanEngine.Abstractions/LingFanEngine.Abstractions.csproj',
            'src/EngineCore/LingFanEngine.DslCore/LingFanEngine.DslCore.csproj',
            'src/EngineCore/LingFanEngine/LingFanEngine.csproj'
          )
          foreach ($proj in $projects) {
            Write-Host "Packing $proj ..."
            dotnet pack $proj -c Release -f net10.0 -o ./artifacts --nologo `
              -p:Version=$env:PACKAGE_VERSION `
              -p:PackageVersion=$env:PACKAGE_VERSION `
              -p:InformationalVersion=$env:PACKAGE_VERSION `
              -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
              -p:FileVersion=$env:ASSEMBLY_VERSION `
              -p:ContinuousIntegrationBuild=true `
              -p:Deterministic=true
            if ($LASTEXITCODE -ne 0) { Write-Error "Pack failed: $proj"; exit 1 }
          }

      - name: List packed packages
        shell: pwsh
        run: |
          Get-ChildItem ./artifacts -Filter '*.nupkg' |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: NuGet login (OIDC → temp API key)
        id: login
        # 受信任发布：用 GitHub OIDC token 向 nuget.org 换一次性临时 key（约 1h 有效）。
        # 须在本仓库 Secrets 配置 NUGET_USER = 你的 nuget.org 用户名（profile name，非邮箱），
        # 且该用户名下已建好匹配本仓库/工作流/环境的 Trusted Publishing 策略。
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org (OIDC trusted publishing)
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = Get-ChildItem ./artifacts -Filter '*.nupkg' -File
          if (-not $pkgs) {
            Write-Error "No .nupkg files found under ./artifacts"
            exit 1
          }
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name) ($([math]::Round($pkg.Length/1KB, 1)) KB) ..."
            dotnet nuget push $pkg.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate `
              --no-symbols `
              --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push package: $($pkg.Name)"
              exit $LASTEXITCODE
            }
          }

      - name: Publish to GitHub Packages (NuGet)
        # 同一批 nupkg 同时推到 GitHub Packages，使仓库 "Packages" 页自动列出。
        # 鉴权用 GITHUB_TOKEN（自动注入），需上方 permissions 含 packages: write。
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = Get-ChildItem ./artifacts -Filter '*.nupkg' -File
          if (-not $pkgs) {
            Write-Error "No .nupkg files found under ./artifacts"
            exit 1
          }
          $ghSource = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name) to GitHub Packages ($([math]::Round($pkg.Length/1KB, 1)) KB) ..."
            dotnet nuget push $pkg.FullName `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate `
              --no-symbols `
              --source $ghSource
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push package to GitHub Packages: $($pkg.Name)"
              exit $LASTEXITCODE
            }
          }

      - name: Upload engine packages
        uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: artifacts/*.nupkg

  publish-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package template + generate manifest
        shell: bash
        run: |
          set -euo pipefail
          # 模板版本独立于引擎 tag：仅在 src/Template/V1 内容变化时手动 bump
          # src/Template/template-meta.json 的 version，避免每次引擎发版都抬高模板版本
          # 导致所有 SDK 重复下载同一份没变过的模板。
          META="src/Template/template-meta.json"
          VER=$(jq -r '.version' "$META")
          MIN_SDK=$(jq -r '.minSdkVersion' "$META")
          TAG="${{ github.ref_name }}"   # 仅用于定位本次 Release 的 asset 下载地址
          TPL_DIR="src/Template/V1"
          ZIP="LingFanEngine.Template.zip"

          # 引擎版本注入：把模板主 csproj 的 LingFanEngine PackageReference 版本替换为本次 tag 版本
          # （模板源码中的基线版本仅用于开发期本地 local-feed 构建）
          ENGINE_VER="${GITHUB_REF_NAME#v}"
          MAIN_CSPROJ="$TPL_DIR/_LingFanEngineTemplateTitle_/src/_LingFanEngineTemplateTitle_/_LingFanEngineTemplateTitle_.csproj"
          sed -i -E "s|(<PackageReference\s+Include=\"LingFanEngine\"\s+Version=\")[^\"]+(\")|\1${ENGINE_VER}\2|g" "$MAIN_CSPROJ"
          echo "模板引擎版本注入: LingFanEngine -> ${ENGINE_VER}"

          # 打包模板目录（排除构建产物、VCS 以及任何 zip 残留）
          (cd "$TPL_DIR" && zip -r "${{ github.workspace }}/$ZIP" . \
            -x "*/bin/*" "*/obj/*" "*/.vs/*" "*/.git/*" "*.zip" "*.tmp" "*.bak")

          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)

          cat > updates/template-latest.json <<EOF
          {
            "version": "$VER",
            "assetUrl": "https://github.com/MoFeng-02/LingFanEngine/releases/download/$TAG/$ZIP",
            "assetSha256": "$SHA",
            "publishedUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minSdkVersion": "$MIN_SDK",
            "releaseNotesUrl": "https://github.com/MoFeng-02/LingFanEngine/releases/tag/$TAG",
            "mirrors": [
              "https://gitee.com/MoFeng-02/LingFanEngine/releases/download/$TAG/$ZIP"
            ]
          }
          EOF

          echo "模板版本=$VER（独立于引擎 tag $TAG）；minSdkVersion=$MIN_SDK；sha256=$SHA"

      - name: Upload template package
        uses: actions/upload-artifact@v4
        with:
          name: template-package
          path: |
            LingFanEngine.Template.zip
            updates/template-latest.json

  publish-sdk-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 引擎经 NuGet 分发：SDK 的 ProjectReference 由 MSBuild 自动按需构建，无需种子 DLL
      - name: AOT publish SDK.Desktop (win-x64)
        run: dotnet publish src/SDK_Toolkit/LingFanEngine.SDK.Desktop/LingFanEngine.SDK.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PackTemplate=true -p:Version=${{ steps.version.outputs.VERSION }}

      # Windows runner 默认无 Unix 版 zip 命令，改用 PowerShell 原生 Compress-Archive
      - name: Package
        shell: pwsh
        run: |
          $publishDir = "src/SDK_Toolkit/LingFanEngine.SDK.Desktop/bin/Release/net10.0/win-x64/publish"
          $zipPath = "${{ github.workspace }}/LingFanEngine.SDK.Desktop-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

      - name: Upload SDK windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-windows
          path: LingFanEngine.SDK.Desktop-win-x64.zip

  publish-sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # NativeAOT 在 Linux 需要 clang + zlib 开发头文件
      - name: Install NativeAOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: AOT publish SDK.Desktop (linux-x64)
        run: dotnet publish src/SDK_Toolkit/LingFanEngine.SDK.Desktop/LingFanEngine.SDK.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:PackTemplate=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Package
        shell: bash
        run: |
          cd src/SDK_Toolkit/LingFanEngine.SDK.Desktop/bin/Release/net10.0/linux-x64/publish
          zip -r "${{ github.workspace }}/LingFanEngine.SDK.Desktop-linux-x64.zip" .

      - name: Upload SDK linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-linux
          path: LingFanEngine.SDK.Desktop-linux-x64.zip

  publish-sdk-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: AOT publish SDK.Desktop (osx-arm64)
        run: dotnet publish src/SDK_Toolkit/LingFanEngine.SDK.Desktop/LingFanEngine.SDK.Desktop.csproj -c Release -r osx-arm64 --self-contained true -p:PublishAot=true -p:PackTemplate=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Package
        shell: bash
        run: |
          cd src/SDK_Toolkit/LingFanEngine.SDK.Desktop/bin/Release/net10.0/osx-arm64/publish
          zip -r "${{ github.workspace }}/LingFanEngine.SDK.Desktop-osx-arm64.zip" .

      - name: Upload SDK macos artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-macos
          path: LingFanEngine.SDK.Desktop-osx-arm64.zip

  release:
    needs: [publish-engine, publish-template, publish-sdk-windows, publish-sdk-linux, publish-sdk-macos]
    runs-on: ubuntu-latest
    # 仅 release job 需要写权限创建 Release；其余 job 继承仓库默认 token（含 actions 作用域，
    # 供 upload/download-artifact 正常调 API）。
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LingFan Engine ${{ github.ref_name }}
          files: |
            artifacts/engine-package/*.nupkg
            artifacts/template-package/LingFanEngine.Template.zip
            artifacts/template-package/updates/template-latest.json
            artifacts/sdk-windows/LingFanEngine.SDK.Desktop-win-x64.zip
            artifacts/sdk-linux/LingFanEngine.SDK.Desktop-linux-x64.zip
            artifacts/sdk-macos/LingFanEngine.SDK.Desktop-osx-arm64.zip
          generate_release_notes: true
